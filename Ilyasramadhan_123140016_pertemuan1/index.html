<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kantin POS - Mini Kasir Kampus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Kantin POS Kampus</h1>
      <p>Aplikasi Kasir & Keranjang Belanja Sederhana</p>
    </header>

    <main class="grid-layout">
      <!-- Sisi Kiri: Form Input Barang -->
      <section class="card">
        <h2>Tambah Barang</h2>
        <form id="item-form" novalidate>
          <div class="form-group">
            <label for="item-name">Nama Barang</label>
            <input type="text" id="item-name" placeholder="Contoh: Nasi Goreng, Air Mineral">
            <small class="error-msg" id="error-name"></small>
          </div>

          <div class="form-group">
            <label for="item-price">Harga Satuan (Rp)</label>
            <input type="number" id="item-price" placeholder="Minimal 500" min="500">
            <small class="error-msg" id="error-price"></small>
          </div>

          <div class="form-group">
            <label for="item-qty">Jumlah (Qty)</label>
            <input type="number" id="item-qty" placeholder="Minimal 1" min="1" value="1">
            <small class="error-msg" id="error-qty"></small>
          </div>

          <button type="submit" class="btn btn-primary">+ Tambah ke Keranjang</button>
        </form>
      </section>

      <!-- Sisi Kanan: Tabel Keranjang Belanja -->
      <section class="card">
        <div class="card-header-flex">
          <h2>Daftar Keranjang</h2>
          <button id="btn-reset" class="btn btn-danger-outline" type="button">Transaksi Baru</button>
        </div>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama Barang</th>
                <th>Harga</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="cart-table-body">
              <!-- Item akan dirender melalui JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Rangkuman Perhitungan & Pembayaran -->
        <div class="summary-section">
          <div class="summary-row">
            <span>Total Belanja:</span>
            <strong id="display-gross-total">Rp 0</strong>
          </div>
          <div class="summary-row text-success">
            <span id="discount-label">Diskon (10% jika &ge; Rp 50.000):</span>
            <strong id="display-discount">- Rp 0</strong>
          </div>
          <div class="summary-row total-highlight">
            <span>Total Akhir:</span>
            <strong id="display-grand-total">Rp 0</strong>
          </div>

          <hr class="divider">

          <!-- Modul Kalkulator Uang Bayar -->
          <div class="payment-group">
            <label for="cash-input">Uang Bayar (Rp):</label>
            <input type="number" id="cash-input" placeholder="Masukkan uang diterima" min="0">
            <div id="payment-status" class="payment-feedback"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
